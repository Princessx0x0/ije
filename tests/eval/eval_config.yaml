# Ije eval metrics. Both run locally (no managed eval service region needed).
# Bar before any deploy: plan_rules 1 on every case, ije_judge >= 4 on every case.
metrics_to_run:
  - plan_rules
  - ije_judge

custom_metrics:
  # Deterministic: what the agent did (tool calls), cannot be talked round.
  - name: plan_rules
    custom_function_file: plan_rules.py
  # LLM-as-judge against each case's expected behaviour (the case `reference`).
  - name: ije_judge
    custom_function_file: ije_judge.py
